name: publicate-development
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: publicate
      POSTGRES_USER: publicate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - publicate_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U publicate -d publicate"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  publicate_db:
